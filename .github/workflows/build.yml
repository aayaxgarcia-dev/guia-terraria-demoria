name: Compilar plugin desde zip
 
on:
  push:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
 
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
 
      # Si en la raíz del repo hay un .zip, lo descomprime (usa el más reciente).
      # Si no hay zip, compila el repo tal cual.
      - name: Preparar proyecto
        run: |
          zip_file=$(ls -t ./*.zip 2>/dev/null | head -n1 || true)
          if [ -n "$zip_file" ]; then
            echo "Usando $zip_file"
            rm -rf _project && mkdir _project
            unzip -q "$zip_file" -d _project
            search=_project
          else
            search=.
          fi
          build_file=$(find "$search" -maxdepth 3 \( -name build.gradle.kts -o -name build.gradle -o -name pom.xml \) | head -n1)
          if [ -z "$build_file" ]; then
            echo "No encontré build.gradle(.kts) ni pom.xml" && exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$build_file")" >> "$GITHUB_ENV"
 
      - name: Compilar
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f pom.xml ]; then
            mvn -B -q package
          elif [ -f gradlew ]; then
            chmod +x gradlew && ./gradlew build
          else
            gradle build
          fi
 
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            ${{ env.PROJECT_DIR }}/target/*.jar
 
